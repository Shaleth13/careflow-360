<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2540;--mut:#5a6178;--navy:#14286e;--blue:#2f6bff;--line:#d5dcee;--red:#d64545;--amb:#d08a00;--grn:#2e9e6b;--soft:#eaf0ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1426;--card:#171f38;--ink:#e8ecf8;--mut:#9aa6c8;--line:#2b3658;--soft:#1d2a52;--navy:#0b1840;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1426;--card:#171f38;--ink:#e8ecf8;--mut:#9aa6c8;--line:#2b3658;--soft:#1d2a52;--navy:#0b1840;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header h1{font-size:17px;margin:0}header small{color:#b9c6ee}
nav{margin-left:auto;display:flex;gap:6px}nav button{background:transparent;color:#cfd9ff;border:1px solid #3d57a8;border-radius:6px;padding:6px 12px;cursor:pointer}nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{padding:16px 20px;max-width:1200px;margin:auto}.banner{font-size:12px;color:var(--mut);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:5px 11px;cursor:pointer;font-size:12px}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:var(--navy);color:#fff;cursor:pointer;font-size:12px;white-space:nowrap}tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.b{display:inline-block;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}.P1{background:var(--red)}.P2{background:var(--amb)}.P3{background:#6b7694}.g{background:var(--grn)}.a{background:var(--amb)}.r{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.card h3{margin:0 0 8px;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.03em}
.attn{border:2px solid var(--amb);background:rgba(227,154,0,.12);border-radius:10px;padding:12px;margin:10px 0}.attn h3{margin:0 0 6px;color:var(--amb)}
.conf{color:var(--red);font-weight:700}.ver{color:var(--grn);font-weight:700}.mut{color:var(--mut);font-size:12px}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;margin-bottom:10px}.tl div:before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--blue)}.tl .ev-r:before{background:var(--red)}.tl .ev-a:before{background:var(--amb)}
button.act{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin-right:6px}button.act.sec{background:#6b7694}
.ai{border:1px dashed var(--blue);background:var(--soft);border-radius:8px;padding:10px;white-space:pre-wrap}.back{background:none;border:0;color:var(--blue);cursor:pointer;margin-bottom:6px;font-size:13px}
ul{margin:4px 0;padding-left:18px}
</style></head><body>

const PL={1:"P1",2:"P2",3:"P3"},state={view:"o",sel:null,q:"",pf:"all",cf:"all",sort:"pri",dir:1,appr:{}},app=document.getElementById("app");

function over(){const k=[["Active cases",48],["High priority (P1)",D.filter(d=>d.pri==1).length],["Recent discharge alerts",D.reduce((a,d)=>a+d.newAlert,0)],["Overdue follow-ups",D.reduce((a,d)=>a+d.overdue,0)],["Outreach attempts pending",D.reduce((a,d)=>a+d.pending,0)]];

r.sort((a,b)=>{const x=state.sort=="pri"?a.pri:a[state.sort],y=state.sort=="pri"?b.pri:b[state.sort];return (x>y?1:x<y?-1:0)*state.dir});
